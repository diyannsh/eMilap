
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: foundnear-postgres
    environment:
      POSTGRES_USER: foundnear
      POSTGRES_PASSWORD: foundnear_dev
      POSTGRES_DB: foundnear
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundnear -d foundnear"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-30T02-25-46Z
    container_name: foundnear-minio
    environment:
      MINIO_ROOT_USER: foundnear_minio_admin
      MINIO_ROOT_PASSWORD: foundnear_minio_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:

# ==============================================================================
# e-Milap — Render Blueprint (Free Demo Single-Service Deployment)
# ==============================================================================
# This configuration deploys e-Milap as a unified single-origin service on Render:
# 1. Express API and Vite SPA frontend are served from the same origin on HTTPS.
# 2. Strict cookie sessions (HttpOnly, SameSite=Lax, Secure) work seamlessly without
#    third-party cookie blocking.
# 3. Background matching worker runs in-process via EMBEDDED_WORKER=true.
# 4. Zero real credentials or secrets are stored in this file.
# ==============================================================================

services:
  - type: web
    name: emilap
    runtime: node
    plan: free
    region: oregon
    branch: backend
    buildCommand: npm ci --include=dev && npx prisma generate --schema=database/prisma/schema.prisma && npm run build:all
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      # Single-service worker: runs matching worker loop inside API process
      - key: EMBEDDED_WORKER
        value: "true"

      - key: WORKER_POLL_INTERVAL_MS
        value: "5000"

      # Session secret: automatically generated by Render if not manually provided
      - key: SESSION_SECRET
        generateValue: true

      # PostgreSQL Database URL: Enter your Supabase connection URI in the Render dashboard
      - key: DATABASE_URL
        sync: false

      # AES-256-GCM Encryption Key: 64 hex characters for encrypting private ownership clues
      - key: CLUE_ENCRYPTION_KEY
        sync: false

      # Durable S3/R2 Storage: Render local disk is ephemeral; use Cloudflare R2 / AWS S3
      - key: STORAGE_LOCAL
        value: "false"

      - key: S3_BUCKET_REPORTS
        sync: false

      - key: S3_BUCKET_EVIDENCE
        sync: false

      - key: S3_ACCESS_KEY_ID
        sync: false

      - key: S3_SECRET_ACCESS_KEY
        sync: false

      - key: S3_ENDPOINT
        sync: false

      - key: S3_REGION
        value: auto

      # Optional Generative AI: if omitted, deterministic campus keyword retrieval is used
      - key: GEMINI_API_KEY
        sync: false

      # Google AI Studio model (defaults to active free-tier Flash model)
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"

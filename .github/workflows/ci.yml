name: Continuous Integration & Production Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Code Quality, Typechecking, Testing, and Monorepo Compilation
  # ----------------------------------------------------------------------------
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: foundnear
          POSTGRES_PASSWORD: foundnear_dev
          POSTGRES_DB: foundnear
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: "postgresql://foundnear:foundnear_dev@localhost:5432/foundnear?schema=public"
        run: npx prisma validate --schema database/prisma/schema.prisma

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://foundnear:foundnear_dev@localhost:5432/foundnear?schema=public"
        run: npx prisma generate --schema database/prisma/schema.prisma

      - name: Apply Database Migrations & Push Schema
        env:
          DATABASE_URL: "postgresql://foundnear:foundnear_dev@localhost:5432/foundnear?schema=public"
        run: |
          npm run db:migrate
          npx prisma db push --schema database/prisma/schema.prisma --skip-generate

      - name: Typecheck Workspaces
        run: npm run typecheck

      - name: Build Web Application (Vite)
        run: npm run build:web

      - name: Build API Application (TypeScript)
        run: npm run build:api

      - name: Run Workspace Tests
        env:
          DATABASE_URL: "postgresql://foundnear:foundnear_dev@localhost:5432/foundnear?schema=public"
          STORAGE_LOCAL: "true"
        run: npm run test --workspaces --if-present

  # ----------------------------------------------------------------------------
  # Job 2: Production Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build-verification:
    name: Verify Production Docker Builds
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: foundnear-api:test

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: foundnear-web:test

  # ----------------------------------------------------------------------------
  # Job 3: Python AI Service Verification
  # ----------------------------------------------------------------------------
  python-ai-service-check:
    name: Verify Python AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install AI Service Dependencies
        run: |
          cd apps/ai
          pip install --upgrade pip
          pip install -e .

      - name: Test AI Service Imports and Syntax
        run: |
          cd apps/ai
          python -c "from app.main import app; print('FastAPI app initialized successfully')"
